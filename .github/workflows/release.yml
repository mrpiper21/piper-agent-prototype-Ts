name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # Required to create releases and upload assets
  actions: read    # Required for workflow access

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Delete package-lock.json
        shell: bash
        run: rm -f package-lock.json || del package-lock.json || true

      - name: Install dependencies
        run: npm install --force

      - name: Validate Personal Access Token
        shell: bash
        run: |
          if [ -z "${{ secrets.PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "::error::PERSONAL_ACCESS_TOKEN secret is required to publish to Agent-Releases repository"
            echo "::error::Please create a Personal Access Token with 'repo' scope and add it as a secret"
            exit 1
          fi
          echo "✅ Personal Access Token is configured"
      
      - name: Verify Agent-Releases Repository Access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          REPO_OWNER="mrpiper21"
          REPO_NAME="Agent-Releases"
          
          # Verify repository exists and is accessible
          if curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME" | grep -q '"name"'; then
            echo "✅ Agent-Releases repository is accessible"
          else
            echo "::error::Cannot access Agent-Releases repository. Please verify the token has 'repo' scope."
            exit 1
          fi
      
      - name: Extract Version from Tag
        shell: bash
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION (tag: $TAG_NAME)"
      
      - name: Update Package Version to Match Tag
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "📝 Updating package.json version to $VERSION to match tag $TAG_NAME"
          # Update package.json version using node
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          echo "✅ Updated package.json version to $VERSION"
          # Verify the update
          echo "📋 Current package.json version:"
          node -e "const pkg = require('./package.json'); console.log(pkg.version)"
      
      - name: Create Release in Agent-Releases (if needed)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          REPO_OWNER="mrpiper21"
          REPO_NAME="Agent-Releases"
          
          echo "🏷️  Checking if release $TAG_NAME exists in Agent-Releases..."
          
          # Check if release already exists
          RELEASE_CHECK=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/releases/tags/$TAG_NAME")
          HTTP_STATUS=$(echo "$RELEASE_CHECK" | grep "HTTP_STATUS:" | cut -d: -f2 || echo "unknown")
          RELEASE_BODY=$(echo "$RELEASE_CHECK" | sed '/HTTP_STATUS:/d')
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Release $TAG_NAME already exists in Agent-Releases"
            echo "📦 Release will be updated with new assets from all platforms"
          else
            echo "📌 Release $TAG_NAME does not exist. Creating it..."
            
            # Create the release (this will also create the tag automatically)
            CREATE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"tag_name\": \"$TAG_NAME\",
                \"name\": \"$TAG_NAME\",
                \"body\": \"Release $TAG_NAME - PrintMyFile Agent\\n\\nThis release contains builds for Windows, macOS, and Linux.\",
                \"draft\": false,
                \"prerelease\": false
              }" \
              "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/releases")
            
            CREATE_HTTP_STATUS=$(echo "$CREATE_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2 || echo "unknown")
            CREATE_BODY=$(echo "$CREATE_RESPONSE" | sed '/HTTP_STATUS:/d')
            
            if [ "$CREATE_HTTP_STATUS" = "201" ]; then
              echo "✅ Successfully created release $TAG_NAME in Agent-Releases"
              RELEASE_URL=$(echo "$CREATE_BODY" | grep -o '"html_url":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "")
              if [ -n "$RELEASE_URL" ]; then
                echo "🔗 Release URL: $RELEASE_URL"
              fi
            elif [ "$CREATE_HTTP_STATUS" = "422" ]; then
              # 422 usually means release already exists (race condition) or validation error
              if echo "$CREATE_BODY" | grep -qi "already_exists\|already exist"; then
                echo "ℹ️  Release already exists (created by another build). This is OK - electron-builder will add assets to it."
                # Verify the release exists now
                sleep 2
                VERIFY_CHECK=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/releases/tags/$TAG_NAME")
                VERIFY_STATUS=$(echo "$VERIFY_CHECK" | grep "HTTP_STATUS:" | cut -d: -f2 || echo "unknown")
                if [ "$VERIFY_STATUS" = "200" ]; then
                  echo "✅ Verified: Release $TAG_NAME exists and is ready for assets"
                fi
              else
                echo "⚠️  Failed to create release (422). Response:"
                echo "$CREATE_BODY" | head -10
                echo "Continuing anyway - electron-builder may still be able to publish."
              fi
            else
              echo "⚠️  Failed to create release (HTTP $CREATE_HTTP_STATUS). Response:"
              echo "$CREATE_BODY" | head -10
              echo "Continuing anyway - electron-builder may create the release automatically."
            fi
          fi
      
      - name: Verify Package Configuration
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "📋 Verifying electron-builder configuration..."
          echo "Repository in package.json publish config:"
          node -e "const pkg = require('./package.json'); console.log(JSON.stringify(pkg.build.publish, null, 2))"
          echo ""
          echo "✅ Package is configured to publish to: mrpiper21/Agent-Releases"
          echo ""
          echo "🔍 Environment variables check:"
          echo "GH_TOKEN is set: $([ -n \"$GH_TOKEN\" ] && echo 'YES (length: ${#GH_TOKEN})' || echo 'NO')"
          echo "GITHUB_TOKEN is set: $([ -n \"$GITHUB_TOKEN\" ] && echo 'YES' || echo 'NO')"
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "GITHUB_REF: $GITHUB_REF"
          echo ""
          echo "🔍 Testing token access to Agent-Releases..."
          if curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/mrpiper21/Agent-Releases" | grep -q '"name"'; then
            echo "✅ Token has access to Agent-Releases repository"
          else
            echo "❌ Token does NOT have access to Agent-Releases repository!"
            echo "Please verify the Personal Access Token has 'repo' scope."
          fi

      - name: Initialize Agent-Releases Repository (if empty)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          REPO_OWNER="mrpiper21"
          REPO_NAME="Agent-Releases"
          
          # Check if repository is empty using GitHub API
          # If repo has no default branch, it's empty
          DEFAULT_BRANCH=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME" \
            | grep -o '"default_branch":"[^"]*"' | cut -d'"' -f4 || echo "")
          
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "Repository appears empty. Ensuring README exists..."
            
            # Create a temporary directory
            TEMP_DIR=$(mktemp -d)
            WORK_DIR="$TEMP_DIR/$REPO_NAME"
            
            # Configure git globally for this session
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            
            # Try to clone the repository first (in case it exists but API check failed)
            if git clone --depth 1 "https://$GH_TOKEN@github.com/$REPO_OWNER/$REPO_NAME.git" "$WORK_DIR" 2>/dev/null; then
              echo "Repository exists. Checking if README needs to be added/updated..."
              cd "$WORK_DIR"
            else
              echo "Repository is truly empty. Initializing..."
              mkdir -p "$WORK_DIR"
              cd "$WORK_DIR"
              git init
              git branch -M main
            fi
            
            # Verify we're in a git directory
            if ! git rev-parse --git-dir > /dev/null 2>&1; then
              echo "Error: Not in a git directory. Current directory: $(pwd)"
              exit 1
            fi
            
            # Create or update README
            echo "# Agent Releases" > README.md
            echo "" >> README.md
            echo "This repository contains release builds for the PrintMyFile Agent." >> README.md
            echo "" >> README.md
            echo "## Releases" >> README.md
            echo "" >> README.md
            echo "All releases are available in the [Releases](https://github.com/mrpiper21/Agent-Releases/releases) section." >> README.md
            echo "" >> README.md
            echo "## Installation" >> README.md
            echo "" >> README.md
            echo "Download the appropriate installer for your platform from the latest release." >> README.md
            
            # Add remote if not already added
            if ! git remote get-url origin > /dev/null 2>&1; then
              git remote add origin "https://$GH_TOKEN@github.com/$REPO_OWNER/$REPO_NAME.git"
            else
              git remote set-url origin "https://$GH_TOKEN@github.com/$REPO_OWNER/$REPO_NAME.git"
            fi
            
            # Ensure we're on main branch
            git checkout -b main 2>/dev/null || git checkout main 2>/dev/null || true
            
            # Stage and commit README
            git add README.md
            if git diff --cached --quiet; then
              echo "README is already up to date."
            else
              git commit -m "Add/Update README" || git commit --amend -m "Update README" || true
            fi
            
            # Pull before pushing to handle any remote changes
            git pull origin main --allow-unrelated-histories --no-edit 2>/dev/null || true
            
            # Push to remote
            git push origin main || {
              echo "Push failed. Retrying with pull..."
              git pull origin main --rebase --allow-unrelated-histories 2>/dev/null || git pull origin main --allow-unrelated-histories --no-edit 2>/dev/null || true
              git push origin main
            }
            
            echo "✅ Repository README ensured successfully"
          else
            echo "✅ Repository already has commits (default branch: $DEFAULT_BRANCH), skipping initialization"
          fi

      - name: Create .env file from secrets
        shell: bash
        run: |
          {
            echo "EMAIL_USER=${{ secrets.EMAIL_USER }}"
            echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}"
            echo "API_BASE_URL=${{ secrets.API_BASE_URL }}"
            echo "PERSONAL_ACCESS_TOKEN=${{ secrets.PERSONAL_ACCESS_TOKEN }}"
            echo "REPO_OWNER=${{ secrets.REPO_OWNER }}"
            echo "REPO_NAME=${{ secrets.REPO_NAME }}"
            echo "CLOUD_URL=${{ secrets.CLOUD_URL }}"
            echo "AGENT_ID=${{ secrets.AGENT_ID }}"
            echo "API_KEY=${{ secrets.API_KEY }}"
            echo "LOCATION_NAME=${{ secrets.LOCATION_NAME }}"
            echo "LOG_LEVEL=${{ secrets.LOG_LEVEL }}"
            echo "NODE_ENV=production"
          } > .env

      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # GH_TOKEN is critical - electron-builder uses this for custom repositories
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          # Override GITHUB_TOKEN to use PAT instead of default Actions token
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          Write-Host "🚀 Publishing Windows build to Agent-Releases repository..."
          Write-Host "📦 Target Repository: mrpiper21/Agent-Releases"
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          Write-Host "🏷️  Release Tag: $tag"
          Write-Host "🔑 Using Personal Access Token for authentication"
          Write-Host "🔍 Verifying electron-builder configuration before publish..."
          node -e "const pkg = require('./package.json'); console.log('Publish config:', JSON.stringify(pkg.build.publish, null, 2))"
          # Build first, then publish with explicit config
          npm run build
          # Check if build artifacts exist
          Write-Host "📦 Checking for build artifacts..."
          if (Test-Path "release") {
            Write-Host "✅ Release directory exists"
            Get-ChildItem release -Recurse | Select-Object -First 10 Name, Length
          } else {
            Write-Host "⚠️  Release directory not found"
          }
          # Use npx electron-builder with explicit publish config (all on one line for PowerShell)
          Write-Host "📤 Starting electron-builder publish..."
          Write-Host "🔑 Token check: GH_TOKEN is $([string]::IsNullOrEmpty($env:GH_TOKEN) ? 'NOT SET' : 'SET')"
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $env:DEBUG = "electron-builder:*"
          npx electron-builder --win --publish always --config.publish.provider=github --config.publish.owner=mrpiper21 --config.publish.repo=Agent-Releases --config.publish.private=false --config.publish.releaseType=release --config.publish.token=$env:GH_TOKEN *> electron-builder.log
          $exitCode = $LASTEXITCODE
          Write-Host "📋 electron-builder output:"
          Get-Content electron-builder.log
          if ($exitCode -ne 0) {
            Write-Host "❌ electron-builder publish failed with exit code $exitCode"
            Write-Host "📋 Last 50 lines of output:"
            Get-Content electron-builder.log -Tail 50
            exit $exitCode
          }
          Write-Host "✅ electron-builder publish completed"
          if (Select-String -Path electron-builder.log -Pattern "published|uploaded|release|github.*release" -CaseSensitive:$false) {
            Write-Host "✅ Found publish confirmation in logs:"
            Select-String -Path electron-builder.log -Pattern "published|uploaded|release|github.*release" -CaseSensitive:$false | Select-Object -First 5
          } else {
            Write-Host "⚠️  No publish confirmation found in logs"
            Write-Host "📋 Full electron-builder output:"
            Get-Content electron-builder.log
          }

      - name: Build and Publish (macOS)
        if: matrix.os == 'macos-latest'
        env:
          # GH_TOKEN is critical - electron-builder uses this for custom repositories
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          # Override GITHUB_TOKEN to use PAT instead of default Actions token
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -e  # Exit on error
          echo "🚀 Publishing macOS build to Agent-Releases repository..."
          echo "📦 Target Repository: mrpiper21/Agent-Releases"
          echo "🏷️  Release Tag: ${GITHUB_REF#refs/tags/}"
          echo "🔑 Using Personal Access Token for authentication"
          echo "🔍 Verifying electron-builder configuration before publish..."
          # Verify the publish config will be used
          node -e "const pkg = require('./package.json'); console.log('Publish config:', JSON.stringify(pkg.build.publish, null, 2))"
          echo "🔑 Token check: GH_TOKEN is $([ -n \"$GH_TOKEN\" ] && echo 'SET' || echo 'NOT SET')"
          npm run build
          # Check if build artifacts exist
          echo "📦 Checking for build artifacts..."
          if [ -d "release" ]; then
            echo "✅ Release directory exists"
            ls -la release/ || true
          else
            echo "⚠️  Release directory not found"
          fi
          # Use npx to ensure electron-builder is available
          # Explicitly set all publish config via CLI to override any defaults
          echo "📤 Starting electron-builder publish..."
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Running: npx electron-builder --mac --publish always --config.publish.provider=github --config.publish.owner=mrpiper21 --config.publish.repo=Agent-Releases --config.publish.private=false --config.publish.releaseType=release"
          # Use DEBUG environment variable for verbose output
          # Also set the version explicitly to match the tag
          DEBUG=electron-builder:* npx electron-builder --mac --publish always \
            --config.publish.provider=github \
            --config.publish.owner=mrpiper21 \
            --config.publish.repo=Agent-Releases \
            --config.publish.private=false \
            --config.publish.releaseType=release \
            --config.publish.token=$GH_TOKEN 2>&1 | tee electron-builder.log || {
            echo "❌ electron-builder publish failed!"
            echo "📋 Last 50 lines of electron-builder output:"
            tail -50 electron-builder.log || true
            exit 1
          }
          echo "✅ electron-builder publish completed"
          echo "📋 Checking electron-builder log for publish confirmation..."
          if grep -iE "published|uploaded|release|github.*release" electron-builder.log; then
            echo "✅ Found publish confirmation in logs"
            grep -iE "published|uploaded|release|github.*release" electron-builder.log | head -5
          else
            echo "⚠️  No publish confirmation found in logs"
            echo "📋 Full electron-builder output:"
            cat electron-builder.log
          fi

      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          # GH_TOKEN is critical - electron-builder uses this for custom repositories
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          # Override GITHUB_TOKEN to use PAT instead of default Actions token
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -e  # Exit on error
          echo "🚀 Publishing Linux build to Agent-Releases repository..."
          echo "📦 Target Repository: mrpiper21/Agent-Releases"
          echo "🏷️  Release Tag: ${GITHUB_REF#refs/tags/}"
          echo "🔑 Using Personal Access Token for authentication"
          echo "🔍 Verifying electron-builder configuration before publish..."
          # Verify the publish config will be used
          node -e "const pkg = require('./package.json'); console.log('Publish config:', JSON.stringify(pkg.build.publish, null, 2))"
          echo "🔑 Token check: GH_TOKEN is $([ -n \"$GH_TOKEN\" ] && echo 'SET' || echo 'NOT SET')"
          npm run build
          # Use npx to ensure electron-builder is available
          # Explicitly set all publish config via CLI to override any defaults
          echo "📤 Starting electron-builder publish..."
          echo "Running: npx electron-builder --linux --publish always --config.publish.provider=github --config.publish.owner=mrpiper21 --config.publish.repo=Agent-Releases --config.publish.private=false --config.publish.releaseType=release"
          # Use DEBUG environment variable for verbose output
          DEBUG=electron-builder:* npx electron-builder --linux --publish always \
            --config.publish.provider=github \
            --config.publish.owner=mrpiper21 \
            --config.publish.repo=Agent-Releases \
            --config.publish.private=false \
            --config.publish.releaseType=release \
            --config.publish.token=$GH_TOKEN 2>&1 | tee electron-builder.log || {
            echo "❌ electron-builder publish failed!"
            echo "📋 Last 50 lines of electron-builder output:"
            tail -50 electron-builder.log || true
            exit 1
          }
          echo "✅ electron-builder publish completed"
          echo "📋 Checking electron-builder log for publish confirmation..."
          if grep -i "published\|uploaded\|release" electron-builder.log; then
            echo "✅ Found publish confirmation in logs"
          else
            echo "⚠️  No publish confirmation found in logs"
          fi
      
      - name: Check Publish Step Status
        if: always()
        shell: bash
        run: |
          set +e  # Don't exit on error - this is just a diagnostic step
          echo "📊 Checking publish step status for this build..."
          echo "OS: ${{ matrix.os }}"
          echo "Tag: ${GITHUB_REF#refs/tags/}"
          echo ""
          # Check if electron-builder.log exists (created during publish)
          if [ -f "electron-builder.log" ]; then
            echo "✅ electron-builder.log found - checking for publish confirmation..."
            if grep -qiE "published|uploaded|release.*created|github.*release" electron-builder.log 2>/dev/null; then
              echo "✅ Found publish confirmation in logs"
              grep -iE "published|uploaded|release.*created|github.*release" electron-builder.log 2>/dev/null | head -3 || true
            else
              echo "⚠️  No publish confirmation found in logs"
              echo "📋 Checking for errors in electron-builder.log..."
              if grep -qiE "error|failed|unauthorized|403|404|422" electron-builder.log 2>/dev/null; then
                echo "❌ Found errors in publish logs:"
                grep -iE "error|failed|unauthorized|403|404|422" electron-builder.log 2>/dev/null | head -5 || true
              fi
            fi
          else
            echo "⚠️  electron-builder.log not found - publish step may not have run"
          fi
          echo ""
          echo "Note: This verification runs after each platform build completes."
          echo "If publish failed, check the 'Build and Publish' step logs above."
      
      - name: Verify Release Published
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set +e  # Don't exit on error - we want to report status even if some checks fail
          REPO_OWNER="mrpiper21"
          REPO_NAME="Agent-Releases"
          TAG_NAME=${GITHUB_REF#refs/tags/}
          CURRENT_OS="${{ matrix.os }}"
          
          echo "🔍 Verifying release $TAG_NAME exists in Agent-Releases..."
          echo "📋 Current build OS: $CURRENT_OS"
          echo "📋 Checking both repositories for the release..."
          echo ""
          echo "ℹ️  Note: This verification runs after each platform's build."
          echo "   The release may be created by the first successful build,"
          echo "   and subsequent builds will add assets to it."
          
          # Retry checking for the release (GitHub API may need time to update)
          MAX_RETRIES=6
          RETRY_DELAY=10
          RELEASE_FOUND=0
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "⏳ Attempt $i/$MAX_RETRIES: Checking for release (waiting ${RETRY_DELAY}s before check)..."
            sleep $RETRY_DELAY
            
            # Check if release exists in Agent-Releases
            RELEASE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/releases/tags/$TAG_NAME")
            
            # Extract HTTP status code
            HTTP_STATUS=$(echo "$RELEASE_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2 || echo "unknown")
            RELEASE_BODY=$(echo "$RELEASE_RESPONSE" | sed '/HTTP_STATUS:/d')
            
            echo "📡 API Response Status: $HTTP_STATUS"
            
            # Check for error messages in response
            if echo "$RELEASE_BODY" | grep -q '"message"'; then
              ERROR_MSG=$(echo "$RELEASE_BODY" | grep -o '"message":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "")
              echo "⚠️  API returned error: $ERROR_MSG"
              # Show full response for debugging if it's an error
              if [ "$HTTP_STATUS" != "200" ]; then
                echo "📋 Full API response:"
                echo "$RELEASE_BODY" | head -20
              fi
            fi
            
            if echo "$RELEASE_BODY" | grep -q '"tag_name"'; then
              RELEASE_FOUND=1
              echo "✅ Release found!"
              break
            else
              echo "❌ Release not found yet (attempt $i/$MAX_RETRIES)"
              if [ $i -lt $MAX_RETRIES ]; then
                echo "   Will retry in ${RETRY_DELAY} seconds..."
              fi
            fi
          done
          
          if [ $RELEASE_FOUND -eq 1 ]; then
            echo "✅ Release $TAG_NAME successfully published to Agent-Releases!"
            echo "🔗 View at: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$TAG_NAME"
            
            # Get release details (don't fail if this doesn't work)
            RELEASE_URL=$(echo "$RELEASE_BODY" | grep -o '"html_url":"[^"]*"' | cut -d'"' -f4 || echo "")
            if [ -n "$RELEASE_URL" ]; then
              echo "📦 Release URL: $RELEASE_URL"
            fi
            
            # Check if release has assets
            ASSET_COUNT=$(echo "$RELEASE_BODY" | grep -o '"assets":\[' | wc -l || echo "0")
            if echo "$RELEASE_BODY" | grep -q '"assets"'; then
              ASSET_NAMES=$(echo "$RELEASE_BODY" | grep -o '"name":"[^"]*"' | cut -d'"' -f4 || echo "")
              if [ -n "$ASSET_NAMES" ]; then
                echo "📦 Release assets:"
                echo "$ASSET_NAMES" | head -5
              fi
            fi
            
            echo ""
            echo "✅ Verification successful - release is published to Agent-Releases!"
            exit 0
          else
            echo ""
            echo "❌ Release verification failed after $MAX_RETRIES attempts"
            echo "❌ Release $TAG_NAME NOT found in Agent-Releases!"
            echo ""
            echo "📋 Diagnostic Information:"
            echo "   - Build OS: $CURRENT_OS"
            echo "   - Tag: $TAG_NAME"
            echo "   - Target Repo: $REPO_OWNER/$REPO_NAME"
            echo ""
            echo "Checking if it was published to the source repository instead..."
            SOURCE_REPO=${{ github.repository }}
            SOURCE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$SOURCE_REPO/releases/tags/$TAG_NAME")
            SOURCE_HTTP_STATUS=$(echo "$SOURCE_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2 || echo "unknown")
            SOURCE_BODY=$(echo "$SOURCE_RESPONSE" | sed '/HTTP_STATUS:/d')
            
            if echo "$SOURCE_BODY" | grep -q '"tag_name"'; then
              echo "⚠️  WARNING: Release was published to source repository ($SOURCE_REPO) instead of Agent-Releases!"
              echo "This indicates electron-builder is not using the correct publish configuration."
              echo ""
              echo "Please check:"
              echo "  1. GH_TOKEN is set correctly (should be PERSONAL_ACCESS_TOKEN secret)"
              echo "  2. --config.publish.repo=Agent-Releases is being used in the publish command"
              echo "  3. package.json build.publish.repo is set to Agent-Releases"
              echo "  4. The Personal Access Token has 'repo' scope and access to Agent-Releases"
            else
              echo "⚠️  Release $TAG_NAME not found in either repository."
              echo ""
              echo "Possible causes:"
              echo "  1. The publish step failed (check 'Build and Publish ($CURRENT_OS)' step logs above)"
              echo "  2. electron-builder encountered an error during publish"
              echo "  3. The Personal Access Token doesn't have write access to Agent-Releases"
              echo "  4. The tag doesn't exist in Agent-Releases repository"
              echo ""
              echo "💡 Action items:"
              echo "  - Review the 'Build and Publish ($CURRENT_OS)' step logs for errors"
              echo "  - Verify PERSONAL_ACCESS_TOKEN secret is configured correctly"
              echo "  - Check that the token has 'repo' scope"
              echo "  - Ensure the Agent-Releases repository exists and is accessible"
            fi
            echo ""
            echo "🔗 Check Agent-Releases releases: https://github.com/$REPO_OWNER/$REPO_NAME/releases"
            echo "🔗 Check source repository releases: https://github.com/$SOURCE_REPO/releases"
            echo ""
            echo "⚠️  This verification step failed, but the workflow will continue."
            echo "   Check the publish step logs to determine the root cause."
            exit 1
          fi

      # Artifacts are skipped to save storage quota
      # electron-builder --publish already uploads to GitHub Releases
