name: Build and Release

on:
  push:
    tags:
      - 'v1.0.0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci

      - name: Create .env file from secrets
        shell: bash
        run: |
          {
            echo "EMAIL_USER=${{ secrets.EMAIL_USER }}"
            echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}"
            echo "API_BASE_URL=${{ secrets.API_BASE_URL }}"
            echo "PERSONAL_ACCESS_TOKEN=${{ secrets.PERSONAL_ACCESS_TOKEN }}"
            echo "REPO_OWNER=${{ secrets.REPO_OWNER }}"
            echo "REPO_NAME=${{ secrets.REPO_NAME }}"
            echo "CLOUD_URL=${{ secrets.CLOUD_URL }}"
            echo "AGENT_ID=${{ secrets.AGENT_ID }}"
            echo "API_KEY=${{ secrets.API_KEY }}"
            echo "LOCATION_NAME=${{ secrets.LOCATION_NAME }}"
            echo "LOG_LEVEL=${{ secrets.LOG_LEVEL }}"
            echo "NODE_ENV=production"
          } > .env
      
      - name: Build and publish
        env:
          # Use Personal Access Token with write access to Agent-Releases repo
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run publish
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.os }}-build
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}