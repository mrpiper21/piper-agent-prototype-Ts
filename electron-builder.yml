appId: com.electron.app
productName: Electron React App
copyright: Copyright © 2024

files:
  - out/**
  - "!out/**/*.map" # Exclude source maps
  - node_modules/**
  - package.json

# Force unpack preload script and whatsapp-service.js (required for forked processes)
asar:
  unpack: 
    - "**/preload/**"
    - "**/whatsapp-service.js"

directories:
  output: release
  buildResources: build

win:
  target:
    - target: portable
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64

linux:
  target:
    - target: deb
      arch:
        - x64
